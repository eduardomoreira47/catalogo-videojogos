<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Videojogos</title>
</head>
<body>
    <header>
        <h1>🎮 Catálogo de Videojogos</h1>
        <p>O teu espaço para descobrir e organizar videojogos.</p>
    </header>

    <main>
        <section>
            <h2>Registar videojogo</h2>

            <form action="/jogos" method="post">
                <label for="titulo">Título:</label>
                <input type="text" id="titulo" name="titulo" required>

                <br><br>

                <label for="descricao">Descrição:</label>
                <textarea id="descricao" name="descricao"></textarea>

                <br><br>

                <label for="ano_lancamento">Ano de lançamento:</label>
                <input
                    type="number"
                    id="ano_lancamento"
                    name="ano_lancamento"
                    min="1950"
                    max="2100"
                    required
                >

                <br><br>

                <button type="submit">Guardar videojogo</button>
            </form>
        </section>
    </main>
</body>
</html>
